name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp rotation-copilot-1.html www/index.html
          ls -la www/

      - name: Setup npm project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/status-bar@6 @capacitor/splash-screen@6

      - name: Init Capacitor
        run: npx cap init "Rotation Copilot" "com.rotationcopilot.app" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web to Android
        run: npx cap sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/RotationCopilot.apk
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RotationCopilot-APK
          path: output/RotationCopilot.apk
